name: iPhone UI build check

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/iphone-ui.yml'
      - 'scripts/render_build_iphone.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-iphone-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout patched fork
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use project's declared npm version
        run: npm install --global npm@11.19.0
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check and build iPhone frontend
        working-directory: frontend
        run: npm run build
      - name: Verify packaged web assets
        run: test -s src/openjarvis/server/static/index.html
      - name: Save compiled frontend for inspection
        uses: actions/upload-artifact@v4
        with:
          name: openjarvis-iphone-web
          path: src/openjarvis/server/static/
          retention-days: 7
